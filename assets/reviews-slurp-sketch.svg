<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" aria-hidden="true">
  <style>
    .sk { fill: none; stroke: #1c1917; stroke-linecap: round; stroke-linejoin: round; }
    .sk-soft { stroke: #78716c; }
    .sk-accent { stroke: #f97316; }
    .sk-amber { stroke: #fbbf24; }
    .sk-fill-bowl { fill: #fff7ed; stroke: #1c1917; stroke-width: 2.2; }
    .sk-fill-face { fill: #ffedd5; stroke: #1c1917; stroke-width: 2; }
    .sk-noodle { stroke: #fbbf24; stroke-width: 2.4; fill: none; stroke-linecap: round; }
    .sk-steam { stroke: #a8a29e; stroke-width: 1.6; opacity: 0.7; }
    .sk-slurp { stroke: #f97316; stroke-width: 2; opacity: 0; }
    .draw {
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: sketch-draw 3.2s ease-in-out infinite;
    }
    .draw-d1 { animation-delay: 0s; }
    .draw-d2 { animation-delay: 0.15s; }
    .draw-d3 { animation-delay: 0.3s; }
    .draw-d4 { animation-delay: 0.45s; }
    .noodle-lift {
      animation: noodle-lift 1.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    .chop-move {
      animation: chop-lift 1.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 80% 80%;
    }
    .steam-a { animation: steam-rise 2.2s ease-out infinite; }
    .steam-b { animation: steam-rise 2.2s ease-out 0.7s infinite; }
    .steam-c { animation: steam-rise 2.2s ease-out 1.4s infinite; }
    .slurp-a { animation: slurp-pop 1.6s ease-in-out infinite; }
    .slurp-b { animation: slurp-pop 1.6s ease-in-out 0.2s infinite; }
    .face-bounce { animation: happy-nod 1.6s ease-in-out infinite; transform-origin: 118px 78px; }
    @keyframes sketch-draw {
      0%, 8% { stroke-dashoffset: 120; opacity: 0.2; }
      35%, 70% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes noodle-lift {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-6px) scale(1.03); }
      55% { transform: translateY(-8px) scale(1.04); }
    }
    @keyframes chop-lift {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      45% { transform: rotate(-12deg) translateY(-10px); }
      55% { transform: rotate(-8deg) translateY(-12px); }
    }
    @keyframes steam-rise {
      0% { opacity: 0; transform: translateY(6px); }
      30% { opacity: 0.75; }
      100% { opacity: 0; transform: translateY(-16px); }
    }
    @keyframes slurp-pop {
      0%, 35%, 100% { opacity: 0; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1); }
      65% { opacity: 0.4; transform: scale(1.15); }
    }
    @keyframes happy-nod {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .draw, .noodle-lift, .chop-move, .steam-a, .steam-b, .steam-c, .slurp-a, .slurp-b, .face-bounce {
        animation: none !important;
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }
  </style>
  <rect width="320" height="240" fill="#fffbeb"/>
  <!-- table line -->
  <path class="sk sk-soft draw draw-d1" stroke-width="2" d="M 24 188 Q 160 196 296 188"/>
  <!-- chair back -->
  <path class="sk draw draw-d2" stroke-width="2.2" d="M 72 188 L 72 132 Q 72 118 86 118 L 98 118"/>
  <!-- body -->
  <path class="sk draw draw-d2" stroke-width="2.4" d="M 118 108 Q 128 128 124 168 L 118 188"/>
  <!-- arm to bowl -->
  <path class="sk draw draw-d3" stroke-width="2.2" d="M 124 138 Q 148 148 168 162"/>
  <!-- head -->
  <g class="face-bounce">
    <circle class="sk-fill-face draw draw-d1" cx="118" cy="78" r="22"/>
    <!-- eyes closed in bliss -->
    <path class="sk draw draw-d4" stroke-width="2" d="M 108 76 Q 112 80 116 76"/>
    <path class="sk draw draw-d4" stroke-width="2" d="M 120 76 Q 124 80 128 76"/>
    <!-- open mouth slurping -->
    <ellipse cx="118" cy="88" rx="5" ry="4" fill="#1c1917"/>
    <path class="sk-slurp slurp-a" d="M 126 84 Q 134 82 142 78"/>
    <path class="sk-slurp slurp-b" d="M 126 90 Q 136 92 146 90"/>
  </g>
  <!-- bowl -->
  <ellipse class="sk-fill-bowl draw draw-d2" cx="198" cy="176" rx="52" ry="14"/>
  <path class="sk draw draw-d3" stroke-width="2.4" d="M 146 176 Q 198 198 250 176"/>
  <!-- broth -->
  <ellipse cx="198" cy="172" rx="40" ry="8" fill="#fed7aa" opacity="0.85"/>
  <!-- steam -->
  <path class="sk-steam steam-a" d="M 182 148 Q 178 132 184 118"/>
  <path class="sk-steam steam-b" d="M 198 146 Q 202 128 196 112"/>
  <path class="sk-steam steam-c" d="M 214 148 Q 218 130 210 116"/>
  <!-- noodles in bowl -->
  <g class="noodle-lift">
    <path class="sk-noodle" d="M 168 168 Q 182 160 192 152 Q 202 144 210 136"/>
    <path class="sk-noodle sk-accent" d="M 176 170 Q 188 158 198 146 Q 206 136 214 128"/>
    <path class="sk-noodle" d="M 184 172 Q 194 162 204 154"/>
  </g>
  <!-- chopsticks -->
  <g class="chop-move">
    <path class="sk sk-amber draw draw-d4" stroke-width="2.6" d="M 208 124 L 192 158"/>
    <path class="sk sk-accent draw draw-d4" stroke-width="2.6" d="M 218 122 L 204 160"/>
  </g>
  <!-- scribble joy lines -->
  <path class="sk-accent" stroke-width="1.8" opacity="0.45" d="M 56 62 L 64 54 M 60 66 L 68 66"/>
  <path class="sk-accent" stroke-width="1.8" opacity="0.45" d="M 252 48 L 260 40 M 256 52 L 264 52"/>
  <text x="16" y="28" fill="#78716c" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">SLURP SKETCH &#183; LOOP</text>
</svg>
